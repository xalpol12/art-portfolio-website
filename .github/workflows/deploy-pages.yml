name: Deploy showcase-app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PLACEHOLDER — replace with your real domain (used for canonical/OG URLs, the
      # sitemap, and the CNAME file below). Leave unset (delete this env block) if you
      # don't want a custom domain and will use the default
      # https://<owner>.github.io/<repo>/ URL instead — in that case also add
      # `--base-href /<repo>/` to the build step.
      SITE_BASE_URL: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build showcase-app (site + sitemap/robots.txt)
        run: npm run build:showcase-app

      - name: Custom domain (CNAME)
        # PLACEHOLDER — replace with your real domain, or delete this step entirely if
        # you're using the default github.io URL instead of a custom domain.
        run: echo "example.com" > dist/showcase-app/browser/CNAME

      - name: Prevent Jekyll processing
        run: touch dist/showcase-app/browser/.nojekyll

      - name: SPA fallback for unknown routes
        run: cp dist/showcase-app/browser/index.csr.html dist/showcase-app/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
